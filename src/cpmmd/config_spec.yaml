# This file species the parameters used in the CPMMD model.
# This file get parsed automaticaly when running cargo build and it
# is then used in the python script 'gen_config.py' to generate
# the Config struct that is used in the CPMMD model.

# Types that are supported are:
# - uint (unsigned integer maps to usize)
# - int (integer maps to i32)
# - float (floating point number maps to f64)
# - bool (boolean)
# - List[float] (List of floating points, maps to Vec<f64>)
# If you need to add something else, you can add it in 'gen_config.py'.

# Note: The python part is 'duck-typed' when it comes to these parameters. Hence
# if you start the program with the wrong parameters that are not all listed here
# or are not of the correct type, then there is no catch for that and the program
# could crash.

Config:
  grid_sizex: uint
  grid_sizey: uint
  grid_sizez: uint
  init_cell_size: uint
  init_cell_number_divisions: uint
  temperature: float
  target_area_lambda: float
  target_area: uint
  j_matrix: List[float]
  num_init_adhesions: uint
  init_adhesion_radius: float
  adhesion_annihilation_penalty: float
  adhesion_overflow_number: uint
  adhesion_overflow_penalty: float
  check_connectivity: bool
  target_perimiter: float
  target_perimiter_lambda: float
  area_contraction: float
  adhesion_creation: bool
  max_act: float
  lambda_act: float
  mcs: uint
  seed: uint