[package]
name = "cpm2"
version = "0.1.0"
edition = "2021"

[lib]
name = "cpm2"
path = "src/lib.rs"

[dependencies]
itertools = "0.13.0"
ndarray = "0.16.1"
ndarray-npy = "0.9.1"
png = "0.17.15"
rand = { version = "0.8.5", features = [ "small_rng" ] }
rayon = "1.10.0"

[profile.release]
debug = false
opt-level = 3

